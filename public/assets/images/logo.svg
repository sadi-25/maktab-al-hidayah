<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching the vibrant orange in the image -->
    <linearGradient id="orangeTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FA8500" />
      <stop offset="50%" stop-color="#F57400" />
      <stop offset="100%" stop-color="#E65800" />
    </linearGradient>

    <!-- Clip Path to keep long shadows inside the squircle tile -->
    <clipPath id="squircleShape">
      <rect x="0" y="0" width="512" height="512" rx="115" ry="115" />
    </clipPath>
  </defs>

  <!-- 1. Background Squircle -->
  <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="url(#orangeTile)" />

  <!-- 2. Clipped Content (Shadows & Shapes) -->
  <g clip-path="url(#squircleShape)">
    <!-- Diagonal Long Shadow (Southeast 45°) -->
    <path d="M 256,282 
             L 512,538 
             L 512,310 
             L 438,236 
             L 380,224 
             L 380,148 
             L 512,280 
             L 512,512 
             L 410,512 
             L 395,410 
             L 256,282 Z" 
          fill="#9C3000" 
          opacity="0.32" />

    <!-- 3. REHAL (Crossed Wooden Stand) -->
    <!-- Left Leg: from top-left to bottom-right -->
    <g>
      <path d="M 120,242 
               L 388,382 
               C 397,387 400,398 395,407 
               C 390,416 379,419 370,414 
               L 115,268 
               C 106,263 103,252 108,243 
               C 113,234 124,231 133,236 Z" 
            fill="#FFFFFF" />
      <!-- Cutout Slot on lower right leg -->
      <rect x="295" y="322" width="62" height="13" rx="6.5" ry="6.5" 
            transform="rotate(27.5, 326, 328)" fill="url(#orangeTile)" />
    </g>

    <!-- Right Leg: from top-right to bottom-left -->
    <g>
      <path d="M 392,242 
               L 124,382 
               C 115,387 112,398 117,407 
               C 122,416 133,419 142,414 
               L 397,268 
               C 406,263 409,252 404,243 
               C 399,234 388,231 379,236 Z" 
            fill="#FFFFFF" />
      <!-- Cutout Slot on lower left leg -->
      <rect x="155" y="322" width="62" height="13" rx="6.5" ry="6.5" 
            transform="rotate(-27.5, 186, 328)" fill="url(#orangeTile)" />
    </g>

    <!-- 4. OPEN QURAN BOOK -->
    <!-- Center Spine Divider -->
    <rect x="253" y="182" width="6" height="98" rx="3" ry="3" fill="#FFFFFF" />

    <!-- Left Outer Cover/Rim -->
    <path d="M 253,180 
             L 155,138 
             C 148,135 140,138 136,144 
             L 74,236 
             C 70,242 72,248 78,250 
             L 116,260 
             L 253,283 
             L 253,270 
             L 122,247 
             L 88,238 
             L 142,154 
             L 253,194 Z" 
          fill="#FFFFFF" />

    <!-- Right Outer Cover/Rim -->
    <path d="M 259,180 
             L 357,138 
             C 364,135 372,138 376,144 
             L 438,236 
             C 442,242 440,248 434,250 
             L 396,260 
             L 259,283 
             L 259,270 
             L 390,247 
             L 424,238 
             L 370,154 
             L 259,194 Z" 
          fill="#FFFFFF" />

    <!-- Left Page Block -->
    <path d="M 248,192 
             L 162,152 
             C 158,150 153,152 150,156 
             L 128,218 
             C 126,222 128,226 132,228 
             L 248,266 Z" 
          fill="#FFFFFF" />

    <!-- Right Page Block -->
    <path d="M 264,192 
             L 350,152 
             C 354,150 359,152 362,156 
             L 384,218 
             C 386,222 384,226 380,228 
             L 264,266 Z" 
          fill="#FFFFFF" />
  </g>
</svg>