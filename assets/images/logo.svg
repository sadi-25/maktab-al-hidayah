<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 512" width="1800" height="512">
  <defs>
    <linearGradient id="quranLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FA8500" />
      <stop offset="45%" stop-color="#F57C00" />
      <stop offset="100%" stop-color="#E86A00" />
    </linearGradient>
    <clipPath id="squircleLogoClip">
      <rect x="0" y="0" width="512" height="512" rx="105" ry="105" />
    </clipPath>
  </defs>

  <!-- LEFT: Official Orange Squircle Quran Emblem (scaled slightly to 484x484 centered vertically) -->
  <g transform="translate(14, 14) scale(0.9453125)">
    <rect x="0" y="0" width="512" height="512" rx="105" ry="105" fill="url(#quranLogoGrad)" />
    <g clip-path="url(#squircleLogoClip)">
      <path
        d="M 256,282 L 512,538 L 512,310 L 438,236 L 380,224 L 380,148 L 512,280 L 512,512 L 410,512 L 395,410 L 256,282 Z"
        fill="#B85000"
        opacity="0.42"
      />
      <g>
        <path
          d="M 120,242 L 388,382 C 397,387 400,398 395,407 C 390,416 379,419 370,414 L 115,268 C 106,263 103,252 108,243 C 113,234 124,231 133,236 Z"
          fill="#FFFFFF"
        />
        <rect
          x="295"
          y="322"
          width="62"
          height="13"
          rx="6.5"
          ry="6.5"
          transform="rotate(27.5, 326, 328)"
          fill="url(#quranLogoGrad)"
        />
      </g>
      <g>
        <path
          d="M 392,242 L 124,382 C 115,387 112,398 117,407 C 122,416 133,419 142,414 L 397,268 C 406,263 409,252 404,243 C 399,234 388,231 379,236 Z"
          fill="#FFFFFF"
        />
        <rect
          x="155"
          y="322"
          width="62"
          height="13"
          rx="6.5"
          ry="6.5"
          transform="rotate(-27.5, 186, 328)"
          fill="url(#quranLogoGrad)"
        />
      </g>
      <rect x="253" y="182" width="6" height="98" rx="3" ry="3" fill="#FFFFFF" />
      <path
        d="M 253,180 L 155,138 C 148,135 140,138 136,144 L 74,236 C 70,242 72,248 78,250 L 116,260 L 253,283 L 253,270 L 122,247 L 88,238 L 142,154 L 253,194 Z"
        fill="#FFFFFF"
      />
      <path
        d="M 259,180 L 357,138 C 364,135 372,138 376,144 L 438,236 C 442,242 440,248 434,250 L 396,260 L 259,283 L 259,270 L 390,247 L 424,238 L 370,154 L 259,194 Z"
        fill="#FFFFFF"
      />
      <path
        d="M 248,192 L 162,152 C 158,150 153,152 150,156 L 128,218 C 126,222 128,226 132,228 L 248,266 Z"
        fill="#FFFFFF"
      />
      <path
        d="M 264,192 L 350,152 C 354,150 359,152 362,156 L 384,218 C 386,222 384,226 380,228 L 264,266 Z"
        fill="#FFFFFF"
      />
    </g>
  </g>

  <!-- RIGHT TOP: Exact Geometric Orange Arabic Calligraphy (مَكْتَبُ الْهِدَايَةِ) -->
  <g fill="#F38200">
    <!-- ================= LEFT WORD: الْهِدَايَةِ (x: 565..1186) ================= -->
    <!-- 1. Tā' Marbūṭah (ـةِ) + baseline to Yā' (x: 565..744) -->
    <path
      fill-rule="evenodd"
      d="M 618,148
         H 624
         C 653,148 676,171 676,200
         V 228
         H 712
         V 164
         C 712,155 719,148 728,148
         C 737,148 744,155 744,164
         V 244
         C 744,253 737,260 728,260
         H 617
         C 588,260 565,237 565,208
         V 200
         C 565,171 588,148 618,148 Z
         M 620,178
         C 607,178 597,188 597,201
         V 228
         H 644
         V 201
         C 644,188 634,178 620,178 Z"
    />
    <!-- Two dots above ة -->
    <circle cx="598" cy="114" r="14" />
    <circle cx="642" cy="114" r="14" />
    <!-- Kasrah below ة -->
    <rect x="598" y="284" width="60" height="13" rx="3" />
    <!-- Fatḥah above ي -->
    <rect x="696" y="108" width="60" height="13" rx="3" />
    <!-- Two dots below ي -->
    <circle cx="702" cy="290" r="14" />
    <circle cx="746" cy="290" r="14" />

    <!-- 2. Alif after Dāl (ا) -->
    <rect x="768" y="92" width="32" height="168" rx="16" />

    <!-- 3. Continuous segment: Dāl (ـدَ) + Medial Hā' (ـهِـ) + Lām (لْـ) (x: 816..1130) -->
    <!-- Baseline from Dāl left tip (816) to Lām right edge (1130) -->
    <rect x="816" y="228" width="314" height="32" rx="16" />
    <!-- Dāl upper diagonal/curved arm -->
    <path
      d="M 838,162 C 832,154 835,144 844,140 C 852,136 862,139 868,146 L 932,232 L 902,254 Z"
    />
    <!-- Fatḥah above د -->
    <rect x="842" y="108" width="60" height="13" rx="3" />

    <!-- Medial Hā' (ـهِـ) arch with double inner window -->
    <path
      fill-rule="evenodd"
      d="M 1010,142
         C 1046,142 1074,168 1074,204
         V 260
         H 946
         V 204
         C 946,168 974,142 1010,142 Z
         M 992,172
         C 982,172 975,180 975,192
         V 228
         H 1002
         V 172 Z
         M 1024,174
         V 228
         H 1046
         V 194
         C 1046,182 1037,174 1024,174 Z"
    />
    <!-- Kasrah below هـ -->
    <rect x="964" y="284" width="60" height="13" rx="3" />

    <!-- Lām (لْـ) vertical stem -->
    <rect x="1098" y="92" width="32" height="168" rx="16" />
    <!-- Sukūn above ل -->
    <circle cx="1114" cy="54" r="15" fill="none" stroke="#F38200" stroke-width="9" />

    <!-- 4. Initial Alif (ا) -->
    <rect x="1154" y="92" width="32" height="168" rx="16" />

    <!-- ================= RIGHT WORD: مَكْتَبُ (x: 1226..1765) ================= -->
    <!-- Continuous baseline from Bā' (1226) to Mīm (1765) -->
    <path
      d="M 1226,168
         C 1226,159 1233,152 1242,152
         C 1251,152 1258,159 1258,168
         V 228
         H 1765
         V 260
         H 1262
         C 1240,260 1226,246 1226,224
         Z"
    />
    <!-- Dot below ب -->
    <circle cx="1344" cy="290" r="14" />
    <!-- Ḍammah (ُ) above ب -->
    <path
      fill-rule="evenodd"
      d="M 1336,132
         C 1349,132 1358,141 1358,153
         C 1358,169 1342,182 1314,188
         L 1310,176
         C 1326,172 1336,166 1339,159
         C 1327,159 1318,151 1318,141
         C 1318,135 1325,132 1336,132 Z"
    />

    <!-- Tā' (ـتَـ) vertical tooth -->
    <rect x="1448" y="160" width="32" height="100" rx="16" />
    <!-- Two dots above ت -->
    <circle cx="1444" cy="114" r="14" />
    <circle cx="1488" cy="114" r="14" />
    <!-- Fatḥah above ت -->
    <rect x="1436" y="74" width="60" height="13" rx="3" />

    <!-- Kāf (ـكْـ) vertical stem + diagonal upper stroke -->
    <rect x="1524" y="152" width="32" height="108" rx="12" />
    <path
      d="M 1528,172 L 1624,92 C 1632,86 1644,88 1650,96 C 1656,104 1654,116 1646,122 L 1548,200 Z"
    />
    <!-- Sukūn above ك -->
    <circle cx="1594" cy="54" r="15" fill="none" stroke="#F38200" stroke-width="9" />

    <!-- Mīm (مَـ) right loop -->
    <path
      fill-rule="evenodd"
      d="M 1714,144
         C 1744,144 1765,166 1765,198
         V 260
         H 1662
         V 198
         C 1662,166 1684,144 1714,144 Z
         M 1714,176
         C 1702,176 1694,185 1694,198
         V 228
         H 1734
         V 198
         C 1734,185 1726,176 1714,176 Z"
    />
    <!-- Fatḥah above م -->
    <rect x="1705" y="108" width="60" height="13" rx="3" />
  </g>

  <!-- RIGHT BOTTOM: Bold Black Bengali Brand Text (মাকতাব আল হিদায়াহ) -->
  <text
    x="565"
    y="456"
    fill="#000000"
    font-family="'Hind Siliguri', sans-serif"
    font-weight="700"
    font-size="145"
    textLength="1200"
    lengthAdjust="spacingAndGlyphs"
  >মাকতাব আল হিদায়াহ</text>
</svg>
