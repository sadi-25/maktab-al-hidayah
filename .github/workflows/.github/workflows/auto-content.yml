name: Auto Update Content

on:
workflow_dispatch:

push:
branches:
- main
paths:
- "content/"
- "scripts/"
- ".github/workflows/auto-content.yml"

permissions:
contents: write

jobs:
generate-content:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Generate content manifest
    run: node scripts/generate-content.js

  - name: Save generated manifest
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add content-manifest.json

      if git diff --cached --quiet; then
        echo "No changes to commit."
      else
        git commit -m "Auto update content manifest"
        git push
      fi
